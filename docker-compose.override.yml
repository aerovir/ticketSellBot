# Переопределение для разработки — hot-reload кода без пересборки образа.
# Активируется автоматически при наличии рядом с docker-compose.yml.
# Не требует ручного включения.
#
# Использование: docker compose up -d  (подхватится автоматически)

services:
  app:
    volumes:
      - .:/app
    environment:
      DEBUG: "true"
