name: Deploy TicketBot

on:
  push:
    branches: [main]
  workflow_dispatch:  # ручной запуск

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          pip install -r requirements.txt

      - name: Проверка импортов
        run: |
          python -c "
          from config import settings
          from core.database import Base
          from core.models import User, Event, Ticket, Payment
          from core.schemas import EventOut, TicketOut
          print('✅ Импорты OK')
          "

  healthcheck:
    runs-on: ubuntu-latest
    needs: [test]
    if: failure()
    steps:
      - name: Уведомление о проблеме
        run: |
          echo "❌ Тесты не прошли. Деплой остановлен."

