name: Deploy TicketBot

on:
  push:
    branches: [main]
  workflow_dispatch:  # ручной запуск

env:
  COMPOSE_FILES: -f docker-compose.yml -f deploy/docker-compose.beget.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Проверка Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Проверка импортов
        run: |
          python -c "from config import settings; from core.database import Base; from core.models import User, Event, Ticket, Payment; from core.schemas import EventOut, TicketOut; print('✅ Импорты OK')"

  deploy:
    runs-on: self-hosted
    needs: [test]
    if: success() && github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Получить код
        uses: actions/checkout@v6

      - name: 📋 Создать .env из секретов

        run: |
          cat > .env << 'ENVEOF'
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/ticketbot
          TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL_ID=${{ secrets.TELEGRAM_CHANNEL_ID }}
          VK_TOKEN=${{ secrets.VK_TOKEN }}
          VK_GROUP_ID=${{ secrets.VK_GROUP_ID }}
          MAX_TOKEN=${{ secrets.MAX_TOKEN }}
          DEBUG=false
          ENVEOF
          echo "✅ .env создан"

      - name: 🛑 Остановить старые контейнеры

        run: |
          docker compose ${{ env.COMPOSE_FILES }} down --remove-orphans 2>/dev/null || true
          echo "✅ Старые контейнеры остановлены"

      - name: 🏗️ Собрать новые образы

        run: |
          docker compose ${{ env.COMPOSE_FILES }} build
          echo "✅ Образы собраны"

      - name: 🐘 Запустить PostgreSQL

        run: |
          docker compose ${{ env.COMPOSE_FILES }} up -d db

      - name: ⏳ Ожидание PostgreSQL

        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U postgres -d ticketbot &>/dev/null; then
              echo "✅ PostgreSQL готов!"
              break
            fi
            echo "  попытка $i/30..."
            sleep 2
          done

      - name: 🗄️ Создать таблицы

        run: |
          docker compose ${{ env.COMPOSE_FILES }} run --rm app python -c "
          import asyncio;
          from core.database import init_db;
          asyncio.run(init_db());
          print('✅ Таблицы созданы');
          " 2>&1

      - name: 🌱 Накатить тестовые мероприятия

        run: |
          docker compose ${{ env.COMPOSE_FILES }} run --rm seed 2>&1 || echo "⚠️ Seed пропущен (возможно уже есть данные)"

      - name: 🚀 Запустить бота

        run: |
          docker compose ${{ env.COMPOSE_FILES }} up -d app
          echo "✅ Бот запущен"

      - name: 🩺 Проверка работоспособности

        run: |
          sleep 5
          if docker compose ps | grep -q "app.*Up"; then
            echo "✅ Бот работает!"
            docker compose logs --tail 10 app
          else
            echo "❌ Бот не запустился!"
            docker compose logs app
            exit 1
          fi

      - name: 📢 Уведомление в Telegram (опционально)
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            echo "✅ Деплой TicketBot завершён успешно"
          else
            echo "❌ Деплой TicketBot завершился с ошибкой: $STATUS"
          fi
