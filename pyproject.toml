[project]
name = "ticketbot"
version = "1.0.0"
description = "Мультиплатформенный бот для продажи билетов на мероприятия"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "aiogram>=3.0",
    "vkbottle>=4.10.0",
    "alembic>=1.13",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "httpx>=0.28",
]
monitoring = [
    "psutil>=5.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30
markers = [
    "integration: тесты, требующие PostgreSQL",
]
